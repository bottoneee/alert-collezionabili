name: Alert Collezionabili

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alert-collezionabili
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Monitor products
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python << 'PY'
          import json, os, re, urllib.request, urllib.parse
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse, urlunparse

          KEYWORDS = [
              "pokemon", "pokémon", "dragon ball", "fusion world", "one piece",
              "booster box", "display", "etb", "elite trainer box", "pokemon center",
              "starter deck", "gift collection", "premium collection",
              "super premium collection", "collector booster", "premium booster",
              "anniversary", "151", "english", "japanese",
              "op-", "op01", "op02", "op03", "op04", "op05", "op06", "op07", "op08", "op09", "op10", "op11", "op12",
              "fb10", "fb11", "fb12"
          ]

          SITES = [
              {"name": "Team Rocket Italia", "url": "https://teamrocketitalia.it/collections/pre-ordini-1/products.json?limit=250", "type": "shopify"},
              {"name": "Gallery Concept", "url": "https://galleryconcept.it/collections/card-game/products.json?limit=250", "type": "shopify"},
              {"name": "Rumble Store", "url": "https://www.rumble-store.com/carte-collezionabili/", "type": "html"},
              {"name": "Il Covo del Nerd", "url": "https://www.ilcovodelnerd.com/categoria-prodotto/carte-e-figurine-da-collezione/", "type": "html"},
              {"name": "JPY Collectibles", "url": "https://jpycollectibles.com/", "type": "html"},
              {"name": "Toys Center", "url": "https://www.toyscenter.it/search?q=pokemon", "type": "html"},
              {"name": "Goathings", "url": "https://goathings.it/", "type": "html"},
              {"name": "Mangakaze", "url": "https://www.mangakaze.com/", "type": "html"},
              {"name": "Mirabilia Store", "url": "https://mirabiliastore.it/", "type": "html"}
          ]

          STATE_FILE = "seen_products.json"

          PRODUCT_PATH_HINTS = [
              "/products/",
              "/product/",
              "/prodotto/",
              "/shop/",
              "/cartes/",
              "/collections/"
          ]

          BAD_HINTS = [
              "account", "login", "carrello", "cart", "checkout", "wishlist",
              "privacy", "cookie", "contatti", "contact", "search", "categoria-prodotto",
              "tag/", "category/", "blog", "instagram", "facebook", "whatsapp"
          ]

          def clean_url(url):
              parsed = urlparse(url)
              return urlunparse((parsed.scheme, parsed.netloc, parsed.path.rstrip("/"), "", "", ""))

          def clean_text(text):
              text = re.sub(r"\s+", " ", text or "").strip()
              return text[:180]

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "text/html,application/json"
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", errors="ignore")

          def matches(text):
              t = text.lower()
              return any(k in t for k in KEYWORDS)

          def looks_like_product_url(url):
              u = url.lower()
              if any(bad in u for bad in BAD_HINTS):
                  return False
              return any(h in u for h in PRODUCT_PATH_HINTS)

          def send_telegram(text):
              data = urllib.parse.urlencode({
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": text,
                  "disable_web_page_preview": "false"
              }).encode()

              urllib.request.urlopen(
                  f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/sendMessage",
                  data=data,
                  timeout=30
              )

          def load_seen():
              if os.path.exists(STATE_FILE):
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      return json.load(f)
              return {}

          def save_seen(seen):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(seen, f, ensure_ascii=False, indent=2, sort_keys=True)

          def shopify_products(site):
              data = json.loads(fetch(site["url"]))
              base = site["url"].split("/collections/")[0]
              result = []

              for p in data.get("products", []):
                  title = clean_text(p.get("title", ""))
                  handle = p.get("handle", "")
                  url = clean_url(base + "/products/" + handle)

                  if title and matches(title):
                      result.append({
                          "site": site["name"],
                          "title": title,
                          "url": url
                      })

              return result

          class ProductLinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.in_a = False
                  self.current_href = ""
                  self.current_text = ""

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      attrs = dict(attrs)
                      href = attrs.get("href", "")
                      title = attrs.get("title", "")
                      aria = attrs.get("aria-label", "")

                      self.in_a = True
                      self.current_href = href
                      self.current_text = clean_text(title + " " + aria)

              def handle_data(self, data):
                  if self.in_a:
                      self.current_text += " " + clean_text(data)

              def handle_endtag(self, tag):
                  if tag == "a" and self.in_a:
                      if self.current_href:
                          self.links.append((clean_text(self.current_text), self.current_href))
                      self.in_a = False
                      self.current_href = ""
                      self.current_text = ""

          def html_products(site):
              html = fetch(site["url"])
              parser = ProductLinkParser()
              parser.feed(html)

              found = {}

              for text, href in parser.links:
                  full_url = clean_url(urljoin(site["url"], href))
                  combined = clean_text(text + " " + full_url)

                  if looks_like_product_url(full_url) and matches(combined):
                      found[full_url] = {
                          "site": site["name"],
                          "title": text if text else full_url,
                          "url": full_url
                      }

              return list(found.values())

          state_exists = os.path.exists(STATE_FILE)
          seen = load_seen()
          alerts = []

          for site in SITES:
              try:
                  products = shopify_products(site) if site["type"] == "shopify" else html_products(site)

                  print(f"{site['name']}: trovati {len(products)} prodotti compatibili")

                  for p in products:
                      key = p["site"] + "|" + p["url"]

                      if key not in seen:
                          seen[key] = {
                              "title": p["title"],
                              "url": p["url"]
                          }

                          if state_exists:
                              alerts.append(
                                  f"🚨 Nuovo prodotto su {p['site']}\n\n{p['title']}\n{p['url']}"
                              )

              except Exception as e:
                  print(f"Errore su {site['name']}: {e}")

          if not state_exists:
              send_telegram("✅ Monitor reinizializzato. Ho salvato i prodotti già presenti: da ora ti avviso solo sui nuovi caricamenti.")
          else:
              for alert in alerts[:20]:
                  send_telegram(alert)

          save_seen(seen)
          PY

      - name: Commit state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull --rebase origin main || true
          git add seen_products.json
          git commit -m "Update seen products" || echo "No changes"
          git push || echo "Push skipped"
