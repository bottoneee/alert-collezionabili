name: Alert Collezionabili

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Monitor products
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python << 'PY'
          import json, os, re, urllib.request, urllib.parse
          from html.parser import HTMLParser

          KEYWORDS = ["pokemon", "pokémon", "dragon ball", "one piece", "fusion world"]

          SITES = [
              {
                  "name": "Team Rocket Italia - Preordini",
                  "url": "https://teamrocketitalia.it/collections/pre-ordini-1/products.json",
                  "type": "shopify"
              },
              {
                  "name": "Rumble Store - Carte Collezionabili",
                  "url": "https://www.rumble-store.com/carte-collezionabili/",
                  "type": "html"
              }
          ]

          STATE_FILE = "seen_products.json"

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", errors="ignore")

          def matches(text):
              t = text.lower()
              return any(k in t for k in KEYWORDS)

          def send_telegram(text):
              token = os.environ["TELEGRAM_TOKEN"]
              chat_id = os.environ["TELEGRAM_CHAT_ID"]
              data = urllib.parse.urlencode({"chat_id": chat_id, "text": text, "disable_web_page_preview": "false"}).encode()
              urllib.request.urlopen(f"https://api.telegram.org/bot{token}/sendMessage", data=data, timeout=30)

          def load_seen():
              if os.path.exists(STATE_FILE):
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      return set(json.load(f))
              return set()

          def save_seen(seen):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(sorted(seen), f, ensure_ascii=False, indent=2)

          def shopify_products(site):
              data = json.loads(fetch(site["url"]))
              products = []
              for p in data.get("products", []):
                  title = p.get("title", "")
                  handle = p.get("handle", "")
                  url = site["url"].split("/collections/")[0] + "/products/" + handle
                  if matches(title):
                      products.append((title, url))
              return products

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  attrs = dict(attrs)
                  href = attrs.get("href", "")
                  title = attrs.get("title", "")
                  if href:
                      self.links.append((title, href))

          def html_products(site):
              html = fetch(site["url"])
              parser = LinkParser()
              parser.feed(html)
              found = []
              for title, href in parser.links:
                  text = (title + " " + href).strip()
                  if matches(text):
                      if href.startswith("/"):
                          href = "https://www.rumble-store.com" + href
                      found.append((text[:120], href))
              return list(dict.fromkeys(found))

          seen = load_seen()
          new_seen = set(seen)
          alerts = []

          for site in SITES:
              products = shopify_products(site) if site["type"] == "shopify" else html_products(site)
              for title, url in products:
                  key = site["name"] + "|" + title + "|" + url
                  new_seen.add(key)
                  if key not in seen:
                      alerts.append(f"🚨 Nuovo prodotto su {site['name']}\n\n{title}\n{url}")

          if not os.path.exists(STATE_FILE):
              send_telegram("✅ Monitor inizializzato. Da ora ti avviso solo sui nuovi prodotti Dragon Ball, One Piece e Pokémon.")
          else:
              for alert in alerts[:10]:
                  send_telegram(alert)

          save_seen(new_seen)
          PY

      - name: Commit state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add seen_products.json
          git commit -m "Update seen products" || echo "No changes"
          git push
