name: Alert Collezionabili

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Monitor products
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python << 'PY'
          import json, os, re, urllib.request, urllib.parse
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse, urlunparse

          KEYWORDS = [
              "pokemon", "pokémon", "dragon ball", "fusion world", "one piece",
              "booster box", "etb", "elite trainer box", "pokemon center",
              "starter deck", "gift collection", "premium collection",
              "super premium collection", "collector booster", "premium booster",
              "anniversary", "151", "english", "japanese", "op-", "fb10", "fb11"
          ]

          STOCK_WORDS = [
              "disponibile", "aggiungi al carrello", "acquista", "preordina",
              "pre-ordina", "prenota", "in stock", "available"
          ]

          SITES = [
              {"name": "Team Rocket Italia", "url": "https://teamrocketitalia.it/collections/pre-ordini-1/products.json", "type": "shopify"},
              {"name": "Rumble Store", "url": "https://www.rumble-store.com/carte-collezionabili/", "type": "html"},
              {"name": "Gallery Concept", "url": "https://galleryconcept.it/collections/card-game/products.json", "type": "shopify"},
              {"name": "Il Covo del Nerd", "url": "https://www.ilcovodelnerd.com/categoria-prodotto/carte-e-figurine-da-collezione/", "type": "html"},
              {"name": "JPY Collectibles", "url": "https://jpycollectibles.com/", "type": "html"},
              {"name": "Toys Center", "url": "https://www.toyscenter.it/search?q=pokemon", "type": "html"},
              {"name": "Goathings", "url": "https://goathings.it/", "type": "html"},
              {"name": "Mangakaze", "url": "https://www.mangakaze.com/", "type": "html"},
              {"name": "Mirabilia Store", "url": "https://mirabiliastore.it/", "type": "html"}
          ]

          STATE_FILE = "seen_products.json"

          def clean_url(url):
              parsed = urlparse(url)
              return urlunparse((parsed.scheme, parsed.netloc, parsed.path.rstrip("/"), "", "", ""))

          def clean_text(text):
              text = re.sub(r"\s+", " ", text or "").strip()
              return text[:160]

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", errors="ignore")

          def matches(text):
              t = text.lower()
              return any(k in t for k in KEYWORDS)

          def is_available(text):
              t = text.lower()
              return any(w in t for w in STOCK_WORDS)

          def send_telegram(text):
              data = urllib.parse.urlencode({
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": text,
                  "disable_web_page_preview": "false"
              }).encode()

              urllib.request.urlopen(
                  f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/sendMessage",
                  data=data,
                  timeout=30
              )

          def load_seen():
              if os.path.exists(STATE_FILE):
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      return json.load(f)
              return {}

          def save_seen(seen):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(seen, f, ensure_ascii=False, indent=2, sort_keys=True)

          def shopify_products(site):
              data = json.loads(fetch(site["url"]))
              base = site["url"].split("/collections/")[0]
              result = []

              for p in data.get("products", []):
                  title = clean_text(p.get("title", ""))
                  handle = p.get("handle", "")
                  url = clean_url(base + "/products/" + handle)

                  available = False
                  for v in p.get("variants", []):
                      if v.get("available") is True:
                          available = True

                  if matches(title):
                      result.append({
                          "site": site["name"],
                          "title": title,
                          "url": url,
                          "available": available
                      })

              return result

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      attrs = dict(attrs)
                      href = attrs.get("href", "")
                      title = attrs.get("title", "")
                      aria = attrs.get("aria-label", "")
                      text = clean_text(title + " " + aria + " " + href)

                      if href:
                          self.links.append((text, href))

          def html_products(site):
              html = fetch(site["url"])
              parser = LinkParser()
              parser.feed(html)

              found = {}

              for text, href in parser.links:
                  full_url = clean_url(urljoin(site["url"], href))
                  combined = clean_text(text + " " + full_url)

                  if matches(combined):
                      found[full_url] = {
                          "site": site["name"],
                          "title": combined,
                          "url": full_url,
                          "available": is_available(html)
                      }

              return list(found.values())

          seen = load_seen()
          alerts = []

          for site in SITES:
              try:
                  products = shopify_products(site) if site["type"] == "shopify" else html_products(site)

                  for p in products:
                      key = p["site"] + "|" + p["url"]
                      old = seen.get(key)

                      current_status = "available" if p["available"] else "seen"

                      if old is None:
                          seen[key] = {
                              "title": p["title"],
                              "url": p["url"],
                              "status": current_status
                          }
                          alerts.append(
                              f"🚨 Nuovo prodotto su {p['site']}\n\n{p['title']}\n{p['url']}"
                          )

                      elif old.get("status") != "available" and p["available"]:
                          seen[key]["status"] = "available"
                          alerts.append(
                              f"🔄 Possibile restock/disponibilità su {p['site']}\n\n{p['title']}\n{p['url']}"
                          )

              except Exception as e:
                  print(f"Errore su {site['name']}: {e}")

          if not os.path.exists(STATE_FILE):
              send_telegram("✅ Monitor inizializzato. Da ora controllo nuovi prodotti e possibili restock.")
          else:
              for alert in alerts[:15]:
                  send_telegram(alert)

          save_seen(seen)
          PY

      - name: Commit state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull --rebase origin main || true
          git add seen_products.json
          git commit -m "Update seen products" || echo "No changes"
          git push || echo "Push skipped"
